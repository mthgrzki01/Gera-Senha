<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <h1>Gerador de Senhas</h1>

        <label for="tamanho">Tamanho da senha (mínimo 4):</label>
        <input type="number" id="tamanho" min="4" value="8">

        <label for="complexidade">Complexidade:</label>
        <select id="complexidade">
            <option value="1">Baixa (letras minúsculas)</option>
            <option value="2">Média (letras minúsculas e maiúsculas)</option>
            <option value="3">Alta (letras, números)</option>
            <option value="4">Muito Alta (letras, números, caracteres especiais)</option>
        </select>

        <button id="gerar">Gerar Senha</button>

        <div class="senha-container">
            <div id="senha" class="senha"></div>
            <button id="salvar">Copiar Senha</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function() {
                    console.log('Service Worker registrado com sucesso!');
                })
                .catch(function(error) {
                    console.log('Falha ao registrar o Service Worker: ', error);
                });
        }
    </script>
</body>


</html>
